# Route only known legacy content hosts to the local compatibility service.
<VirtualHost *:80>
    ServerName dl.stickershop.line.naver.jp
    ServerAlias os.line.naver.jp
    ServerAlias dl.os.line.naver.jp
    ServerAlias dl.shop.line.naver.jp
    ServerAlias cac-dl.stickershop.line.naver.jp.line-zero.akadns.net
    ServerAlias *.stickershop.line.naver.jp
    ServerAlias openapis.jboard.navercorp.jp
    ServerAlias appresources.line.naver.jp
    ServerAlias cafeapi.line.naver.jp

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass / http://127.0.0.1:8081/
    ProxyPassReverse / http://127.0.0.1:8081/

    ErrorLog ${APACHE_LOG_DIR}/line-legacy-content-error.log
    CustomLog ${APACHE_LOG_DIR}/line-legacy-content-access.log combined
</VirtualHost>
